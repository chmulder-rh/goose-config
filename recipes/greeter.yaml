version: "1.0.0"
title: "Greet the user"
description: "Composes a greeting from the provided name and time-of-day. Returns the greeting as text."

parameters:
  - key: first_name
    input_type: string
    requirement: required
    description: "First name"
  - key: last_name
    input_type: string
    requirement: required
    description: "Last name"
  - key: time_of_day
    input_type: select
    requirement: required
    description: "Time-of-day greeting"
    options:
      - "Good morning"
      - "Good afternoon"
      - "Good evening"

instructions: "Compose a greeting for {{ first_name }} {{ last_name }} using {{ time_of_day }}."

prompt: "{{ time_of_day }}, {{ first_name }} {{ last_name }}!"
