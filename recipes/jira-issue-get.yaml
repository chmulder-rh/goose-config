version: "1.0.0"
title: "Get Jira issue"
description: "Get a Jira issue using issue_id"

parameters:
  - key: issue_id
    input_type: string
    requirement: required
    description: "Jira issue ID or key"

prompt: |
  rovo__getJiraIssue(
    cloudId="2b9e35e3-6bd3-4cec-b838-f4249ee02432",
    issueIdOrKey="{{ issue_id }}",
    fields=["summary", "description", "status", "issuetype", "assignee", "comment"],
    responseContentFormat="markdown"
  )

extensions:
  - type: streamable_http
    name: rovo
    display_name: "Atlassian Rovo MCP Server"
    description: "MCP server for Atlassian Jira and Confluence integration"
    uri: https://mcp.atlassian.com/v2/mcp
    timeout: 300
