version: "1.0.0"
title: "Jira Issue Creator"
description: "Validates RHCLOUD Jira issue fields, maps them to the API format, and creates the ticket. Reports the result as text."

parameters:
  - key: summary
    input_type: string
    requirement: required
    description: "Short title for the Jira issue (e.g. 'Fix CVE in chrome')"

  - key: prefix
    input_type: string
    requirement: required
    description: "Summary prefix e.g. 'scalprum' → [scalprum] Fix bug. Use empty string for none."

  - key: team
    input_type: select
    requirement: required
    description: "Which team owns this ticket?"
    options:
      - Console - Framework
      - Console - UI

  - key: issue_type
    input_type: select
    requirement: required
    description: "What type of issue is this?"
    options:
      - Story
      - Bug
      - Spike
      - Epic
      - Risk
      - Weakness
      - Vulnerability

  - key: activity_type
    input_type: select
    requirement: required
    description: "What kind of work does this represent?"
    options:
      - Quality / Stability / Reliability
      - Security & Compliance
      - Incidents & Support
      - Future Sustainability
      - Associate Wellness & Development
      - Product / Portfolio Work

  - key: assignee_account_id
    input_type: string
    requirement: required
    description: "Jira account ID of the assignee, or 'unassigned'. Must be resolved by the caller before delegation."

instructions: |
  You are the execution layer for RHCLOUD Jira ticket creation.
  Validate the inputs, map fields to the Jira API format, and create the ticket.
  Do not enrich descriptions or ask questions — report the outcome as plain text.

  ⚠️ Do NOT use execute_typescript for validation or API calls. Validate by reasoning,
  then call createJiraIssue directly as an MCP tool.

  ## Validation

  If any value is invalid, report the errors and stop. Do NOT create any ticket.

  Allowed values:
  - team:          "Console - Framework" | "Console - UI"
  - issue_type:    "Story" | "Bug" | "Spike" | "Epic" | "Risk" | "Weakness" | "Vulnerability"
  - activity_type: "Quality / Stability / Reliability" | "Security & Compliance" |
                   "Incidents & Support" | "Future Sustainability" |
                   "Associate Wellness & Development" | "Product / Portfolio Work"
  - summary:       must not be empty
  - assignee_account_id: a Jira account ID string, or "unassigned"

  ## Field Mapping

  ### Summary
  - If prefix "{{ prefix }}" is non-empty: "[{{ prefix }}] {{ summary }}"
  - If prefix is empty: "{{ summary }}"

  ### Team → customfield_10001 (plain UUID string)
  - "Console - Framework" → "ae9633ff-0523-49b5-b99b-16342fc5a327"
  - "Console - UI"        → "cc1c0d99-0567-45c8-bf77-8e6149d7ed83"

  ### Activity Type → customfield_10464
  Pass as: {"value": "{{ activity_type }}"}

  ### Security Level
  If activity_type is "Security & Compliance", include in additional_fields:
    "security": {"name": "Red Hat Employee"}

  ## Create the Ticket

  Call createJiraIssue:
  - cloudId:              "redhat.atlassian.net"
  - projectKey:           "RHCLOUD"
  - issueTypeName:        "{{ issue_type }}"
  - summary:              (mapped above)
  - assignee_account_id:  "{{ assignee_account_id }}" (omit entirely if "unassigned")
  - additional_fields:    team (customfield_10001), activity_type (customfield_10464),
                          security (if Security & Compliance)

prompt: |
  Create a RHCLOUD Jira ticket:
  - Summary:              {{ summary }}
  - Prefix:               {{ prefix }}
  - Team:                 {{ team }}
  - Issue Type:           {{ issue_type }}
  - Activity Type:        {{ activity_type }}
  - Assignee Account ID:  {{ assignee_account_id }}

extensions:
  - type: streamable_http
    name: atlassian-rovo
    uri: https://mcp.atlassian.com/v1/mcp/authv2
    timeout: 300
    env_keys:
      - ATLASSIAN_AUTH
      - ATLASSIAN_CLOUD_ID
      - ATLASSIAN_INSTANCE
